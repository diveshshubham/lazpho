<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signalboard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header>
      <div>
        <span class="eyebrow">CUSTOMER FEEDBACK</span>
        <h1>Signalboard</h1>
        <p>Collect requests. Find the signal. Ship what matters.</p>
      </div>
      <div class="health"><i></i> Lazpho protected</div>
    </header>

    <section class="panel new-idea">
      <form id="idea-form">
        <label>
          What should we build next?
          <input id="title" maxlength="80" placeholder="A short, specific feature request" required>
        </label>
        <label>
          <span class="sr-only">Description</span>
          <input id="description" maxlength="240" placeholder="Add a little context (optional)">
        </label>
        <button type="submit">Submit idea</button>
      </form>
      <p id="message" role="status"></p>
    </section>

    <nav id="filters" aria-label="Filter ideas">
      <button class="active" data-filter="all">All</button>
      <button data-filter="planned">Planned</button>
      <button data-filter="building">Building</button>
      <button data-filter="shipped">Shipped</button>
    </nav>

    <section id="ideas" class="ideas" aria-live="polite"></section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
