name: Long soak

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: long-soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  long-soak:
    name: Node 24 long resource soak
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOAK_SEED: 5192026
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run soak:long
